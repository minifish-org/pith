name: Bedrock diagnostics
on: [push]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go version
      - run: go test -mod=readonly -count=30 -v -run '^TestPortsmithJudgeAiBedrockCases$' ./internal/conformance/ai_bedrock
        env:
          CGO_ENABLED: '0'
      - run: go test -mod=readonly -race -count=10 -v -run '^TestPortsmithJudgeAiBedrockCases$' ./internal/conformance/ai_bedrock
        env:
          CGO_ENABLED: '1'
